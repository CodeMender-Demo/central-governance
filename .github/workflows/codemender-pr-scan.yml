name: CodeMender PR Scan

on:
  pull_request:

jobs:
  compliance-check:
    name: Mandatory CodeMender Scan
    # Skips execution entirely if the pull request is a draft
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Run linting or security scanner
        run: |
          echo "## CodeMender scan for for repo: ${{ github.event.pull_request.head.repo.full_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by PR action:** ${{ github.event.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**PR Title:** ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN }} # Needs read/write access to the target repo
          fetch-depth: 0
          path: ${{ github.event.pull_request.head.repo.name }}

      # Authenticate to Google Cloud securely
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.WIF_PROVIDER }}"
          service_account: "${{ secrets.WIF_SERVICE_ACCOUNT }}"

      # Set up the gcloud CLI
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Download and Install CodeMender On-The-Fly
      - name: Install CodeMender CLI
        run: |
          echo "Downloading CodeMender from Artifact Registry..."
          gcloud artifacts generic download \
            --project=cmoc-prod \
            --location=us \
            --repository=codemender-cli-production \
            --package=cm \
            --version=stable \
            --name=cm-linux-amd64.zip \
            --destination=./
            
          unzip -q cm-linux-amd64.zip
          chmod +x cm
          sudo mv cm /usr/local/bin/cm
          cm --version
          # Initialize Workspace
          cm init

      # Configure Git Identity for the Bot
      - name: Configure Git Identity
        run: |
          git config --global user.name "CodeMender Scan Bot"
          git config --global user.email "codemender-bot@google.com"

      # Add project paths to config.yaml
      - name: Update codeMender config
        run: |
          cat >> ~/.codemender/config.yaml << 'EOF'
          project_paths:
            - "/home/runner/work/${{ github.event.pull_request.head.repo.name }}/${{ github.event.pull_request.head.repo.name }}/${{ github.event.pull_request.head.repo.name }}"
          EOF
      
      # The Core CodeMender Pipeline (Embedded Bash Logic)
      - name: Run CodeMender Scan
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          echo "### Listing changed files..." >> $GITHUB_STEP_SUMMARY
          # 1. Fetch the files from the API and read them into a Bash array line-by-line
          mapfile -t CHANGED_FILES < <(gh api repos/${{ github.repository }}/pulls/${{ github.event.number }}/files --jq '.[].filename')

          # 2. Iterate through the list/array
          for file in "${CHANGED_FILES[@]}"; do
            echo "🔍 Scanning ${{ github.event.pull_request.head.repo.name }}/$file with Gemini 3.7 Flash..."
            cm find "${{ github.event.pull_request.head.repo.name }}/$file" --model gemini-3.7-flash -y 2>&1 | tee scan_output.log
          done

      - name: Report
        run: |
          FINDINGS=$(cm report --status OPEN --format json)
          FINDINGS_COUNT=$(echo "$FINDINGS" | jq '. | length')
          if [ "$FINDINGS_COUNT" -gt 0 ]; then
            echo "${FINDINGS_COUNT} findings discovered."
            echo "## CodeMender Vulnerability Findings Report" >> "$GITHUB_STEP_SUMMARY"
            cm report -f md >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          
          echo "No vulnerabilities found!" >> "$GITHUB_STEP_SUMMARY"
          
      
      # Cleanup Sensitive Binaries (Best Practice)
      - name: Cleanup
        if: always()
        run: |
          rm -f cm-linux-amd64.zip
          rm -f cm
          rm -rf .cm_project
          rm -rf .exploit/
          rm -f gha-creds-*.json
