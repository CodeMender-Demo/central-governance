name: CodeMender Scan
on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'The name of the repository to scan'
        required: true
        type: string

jobs:
  codemender-scan:
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      pull-requests: write
      id-token: write
      security-events: write

    steps:
      # Checkout the TARGET repository instead of the central repo
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.repo_name }}
          token: ${{ secrets.GH_TOKEN }} # Needs read/write access to the target repo
          fetch-depth: 0
          path: ${{ inputs.repo_name }}

      # Authenticate to Google Cloud securely
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.WIF_PROVIDER }}"
          service_account: "${{ secrets.WIF_SERVICE_ACCOUNT }}"

      # Set up the gcloud CLI
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Download and Install CodeMender On-The-Fly. Ensures that the latest binary is used
      - name: Install CodeMender CLI
        run: |
          echo "Downloading CodeMender from Artifact Registry..."
          gcloud artifacts generic download \
            --project=cmoc-prod \
            --location=us \
            --repository=codemender-cli-production \
            --package=cm \
            --version=stable \
            --name=cm-linux-amd64.zip \
            --destination=./
            
          unzip -q cm-linux-amd64.zip
          chmod +x cm
          sudo mv cm /usr/local/bin/cm
          cm --version
          # Initialize Workspace
          cm init

      # Configure Git Identity for the Bot
      - name: Configure Git Identity
        run: |
          git config --global user.name "CodeMender Scan Bot"
          git config --global user.email "codemender-bot@google.com"

      # The Core CodeMender Pipeline (Embedded Bash Logic)
      - name: Run CodeMender Scan
        run: |
          set -e

          echo "🔍 Scanning codebase..."
          cm find ./${{ inputs.repo_name }} --model gemini-3.7-flash -y 2>&1 | tee scan_output.log
      
      - name: Check for Findings
        id: check_findings
        run: |
          # Query Findings
          FINDINGS=$(cm report --status OPEN --format json)
          FINDINGS_COUNT=$(echo "$FINDINGS" | jq '. | length')

          if [ "$FINDINGS_COUNT" -eq 0 ]; then
            echo "🎉 Success! No open vulnerabilities found."
            exit 0
          fi

          echo "⚠️ Found $FINDINGS_COUNT open findings."

      # Generate and Publish the Report
      - name: Generate Security Report
        run: |
          echo "📊 Generating Markdown report..."
          cm report --format md > codemender_summary.md

          # Extract the execution and token usage line from the scan log
          TOKEN_SUMMARY=$(grep "Tokens:" scan_output.log | tail -n 1 || true)

          # If the token summary was found, inject it at the top of the GitHub Step Summary
          if [ -n "$TOKEN_SUMMARY" ]; then
            echo "### 🪙 Execution & Token Usage" >> $GITHUB_STEP_SUMMARY
            echo "> $TOKEN_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
          fi

          echo "# CodeMender Scan Results" >> $GITHUB_STEP_SUMMARY
          cat codemender_summary.md >> $GITHUB_STEP_SUMMARY

      - name: Export JSON Report
        id: export_json_report
        run: |
          cm report --format json > ./${{ inputs.repo_name }}/codemender_report.json
          cat ./${{ inputs.repo_name }}/codemender_report.json

      - name: Verify Findings
        id: verify_findings
        run: |
          # while read -r id; do
          #     echo "Running cm verify command for ID: $id"
          #     cm verify $id --bypass-warning=true -y
          # done < <(jq -r '.[] | .finding_id' ./${{ inputs.repo_name }}/codemender_report.json)

          jq -r '.[] | .finding_id' ./${{ inputs.repo_name }}/codemender_report.json | \
          xargs -I {} -P 5 sh -c 'echo "Running cm verify command for ID: {}"; cm verify {} --bypass-warning=true -y'

          # Update the JSON Report
          cm report --format json > ./${{ inputs.repo_name }}/codemender_report.json
          cat ./${{ inputs.repo_name }}/codemender_report.json

      - name: Format SARIF Report for GitHub UI
        run: |
          python3 -c '
          import json, re, os

          # GitHub input variable to extract relative path dynamically
          repo_name = "${{ inputs.repo_name }}"

          # Load JSON export
          with open("./${{ inputs.repo_name }}/codemender_report.json", "r") as f:
              findings = json.load(f)

          # Initialilze lists and sets
          rules = []
          results = []
          seen_rules = set()
      
          # Map custom severity scales to SARIF levels
          severity_map = {
              "CRITICAL": "error",
              "HIGH": "error",
              "MEDIUM": "warning",
              "LOW": "note",
              "INFO": "note"
          }

          for finding in findings:
              rule_id = finding.get("title", "Unknown-Rule")
              short_desc = finding.get("title", "Security Finding")
              analysis = finding.get("analysis", "")

              # Calculate relative_path for location uri
              file_path = finding.get("file_path", "unknown")
              relative_path = ""
              if repo_name and repo_name in file_path:
                  relative_path = file_path

                  # Strip absolute runner path strings if present
                  if "/home/runner/work/" in relative_path:
                      relative_path = relative_path.split(repo_name + "/")[-1]
                  
                  # Strip the repo directory prefix if it still remains at the front
                  if repo_name and relative_path.startswith(repo_name + "/"):
                      relative_path = relative_path[len(repo_name + "/"):]
                      
                  # Clean up any residual formatting problems
                  relative_path = relative_path.lstrip("/")

              # Populate Rules Array (Ensure each rule ID is unique in the driver definitions)
              if rule_id not in seen_rules:
                  rules.append({
                      "id": rule_id,
                      "shortDescription": {
                          "text": short_desc
                      },
                      "help": {
                          "markdown": f"{short_desc}: {analysis}",
                          "text": f"{short_desc}: {analysis}"
                      }
                  })
                  seen_rules.add(rule_id)
      
              # Map Severity to SARIF Level
              raw_severity = finding.get("severity", "MEDIUM").upper()
              level = severity_map.get(raw_severity, "warning")
      
              # Populate Results Array
              results.append({
                  "ruleId": rule_id,
                  "level": level,
                  "message": {
                      "text": analysis
                  },
                  "locations": [
                      {
                          "physicalLocation": {
                              "artifactLocation": {
                                  "uri": relative_path,
                                  "uriBaseId": "%SRCROOT%"
                              },
                              "region": {
                                  "startLine": finding.get("start_line", 1),
                                  "endLine": finding.get("end_line", 1)
                              }
                          }
                      }
                  ]
              })

          # Construct Final SARIF Structure
          sarif_output = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "Google CodeMender",
                              "version": "0.8.0",
                              "rules": rules
                          }
                      },
                      "results": results
                  }
              ]
          }

          # Save corrected SARIF
          with open("${{ github.workspace }}/${{ inputs.repo_name }}/output.sarif", "w") as f:
              f.write(json.dumps(sarif_output, indent=2))
              print(json.dumps(sarif_output, indent=2))'

      - name: Extract Target Repo Metadata
        id: extract_meta
        run: |
          cd "${{ github.workspace }}/${{ inputs.repo_name }}"
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "ref=$(git symbolic-ref HEAD)" >> $GITHUB_OUTPUT
      
      # Upload the SARIF payload directly to the target repository using the GitHub CLI
      - name: Upload SARIF directly via GitHub CLI
        if: env.NO_FINDINGS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Encode the file
          cat ${{ github.workspace }}/${{ inputs.repo_name }}/output.sarif
          SARIF_GZ_B64=$(gzip -c ${{ github.workspace }}/${{ inputs.repo_name }}/output.sarif | base64 -w 0)
          
          # Send the API command directly using the gh helper tool
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository_owner }}/${{ inputs.repo_name }}/code-scanning/sarifs \
            -f sarif="$SARIF_GZ_B64" \
            -f ref="${{ steps.extract_meta.outputs.ref }}" \
            -f commit_sha="${{ steps.extract_meta.outputs.sha }}" \
            -f tool_name="Google CodeMender"

      # Cleanup Sensitive Binaries (Best Practice)
      - name: Cleanup
        if: always()
        run: |
          rm -f cm-linux-amd64.zip
          rm -f cm
          rm -rf .cm_project
          rm -rf .exploit/
          rm -f gha-creds-*.json
