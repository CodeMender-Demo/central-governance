name: CodeMender Security Scan
    
on:
  pull_request:
    branches: [main]
  # schedule:
    # Nightly full-repo deep scan at 02:00 UTC
    # - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of parallel runners for Deep Scan'
        required: false
        default: '120'
  workflow_call:
    inputs:
      shards:
        required: false
        type: string
        default: '180'
    secrets:
      wif_provider:
          required: true
      wif_service_account:
          required: true
          

permissions:
    contents: read
    id-token: write
    pull-requests: write
    security-events: write

defaults:
  run:
    shell: bash

env:
  CM_DOWNLOAD_URL: https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media
  CM_MODEL: gemini-3.8-flash
  FAIL_ON_SEVERITIES: CRITICAL,HIGH

jobs:
  # ============================================================================
  # TIER 1: Pull Request Diff + Caller/Callee Impact Scan (< 2 minutes)
  # ============================================================================
  pr-diff-scan:
    name: CodeMender PR Diff Scan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.wif_provider }}
          service_account: ${{ secrets.wif_service_account }}

      - name: Install CodeMender CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cm.zip" "$CM_DOWNLOAD_URL"
          unzip -q -o "$RUNNER_TEMP/cm.zip" -d "$RUNNER_TEMP/cm"
          chmod +x "$RUNNER_TEMP/cm/cm"
          echo "$RUNNER_TEMP/cm" >> "$GITHUB_PATH"

      - name: Run Diff Scan with Impact Analysis
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cm init
          cm find . \
            --diff="origin/$BASE_REF" \
            --diff-workers=16 \
            --diff-depth=2 \
            --diff-max-neighbors=15 \
            --model="$CM_MODEL" \
            --fail-on="$FAIL_ON_SEVERITIES" \
            --sandbox=false
          cm report -f sarif > codemender-pr.sarif 

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ !cancelled() && hashFiles('codemender-pr.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codemender-pr.sarif
          category: codemender-pr

  # ============================================================================
  # TIER 2 (STEP 1): Dynamic LPT Directory Sharding (< 15 seconds)
  # ============================================================================
  prepare-shards:
    name: Compute Balanced Scan Shards
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.shard.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Partition files evenly across shards
        id: shard
        env:
          NUM_SHARDS: ${{ inputs.shards || '20' }}
        run: |
          python3 - << 'EOF'
          import json, os, pathlib

          num_shards = int(os.environ.get("NUM_SHARDS", "20"))

          include_exts = {
              ".py", ".java", ".go", ".js", ".jsx", ".mjs", ".cjs",
              ".ts", ".tsx", ".c", ".cc", ".cpp", ".cxx", ".h", ".hpp",
              ".cs", ".rs", ".kt", ".kts", ".rb", ".php"
          }
          exclude_dirs = {
              ".git", ".github", ".codemender", ".cm_project", ".cm_shard",
              "node_modules", "vendor", "dist", "bin", "target", "obj",
              "build", ".gradle", "test", "tests", "__tests__", "spec",
              "mocks", "fixtures", "docs", "examples", "migrations", "third_party"
          }

          # Collect every scannable file and its byte size
          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in exclude_dirs and not d.startswith(".")]
              for f in files:
                  if pathlib.Path(f).suffix in include_exts:
                      rel_path = os.path.relpath(os.path.join(root, f), ".")
                      size = max(1, os.path.getsize(rel_path))
                      all_files.append((rel_path, size))

          # Sort largest files first (LPT) and distribute across N shards
          all_files.sort(key=lambda x: x[1], reverse=True)
          shards = [{"id": i, "file_count": 0, "byte_weight": 0} for i in range(num_shards)]

          for _, size in all_files:
              # Pick shard with fewest files (tie-break by byte_weight)
              target = min(shards, key=lambda s: (s["file_count"], s["byte_weight"]))
              target["file_count"] += 1
              target["byte_weight"] += size

          active_shards = [{"id": s["id"], "file_count": s["file_count"]} for s in shards if s["file_count"] > 0]
          print(f"Created {len(active_shards)} shards. File counts: {[s['file_count'] for s in active_shards]}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(active_shards)}\n")
          EOF

  # ============================================================================
  # TIER 2 (STEP 2): Parallel Sharded Deep Scan (20 runners x 16 workers = 320 workers)
  # ============================================================================
  deep-scan-shard:
    name: Scan Shard ${{ matrix.shard.id }} (${{ matrix.shard.file_count }} files)
    needs: prepare-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 100
      matrix:
        shard: ${{ fromJson(needs.prepare-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.wif_provider }}
          service_account: ${{ secrets.wif_service_account }}

      - name: Install CodeMender CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cm.zip" "$CM_DOWNLOAD_URL"
          unzip -q -o "$RUNNER_TEMP/cm.zip" -d "$RUNNER_TEMP/cm"
          chmod +x "$RUNNER_TEMP/cm/cm"
          echo "$RUNNER_TEMP/cm" >> "$GITHUB_PATH"

      - name: Run Single-Batch CodeMender Scan
        env:
          SHARD_ID: ${{ matrix.shard.id }}
          NUM_SHARDS: ${{ inputs.shards || '180' }}
          CM_TELEMETRY_OPT_OUT: "1"
        run: |
          python3 - << 'EOF'
          import json, os, pathlib

          shard_id = int(os.environ["SHARD_ID"])
          num_shards = int(os.environ.get("NUM_SHARDS", "180"))
          runner_temp = os.environ["RUNNER_TEMP"]

          include_exts = {
              ".py", ".java", ".go", ".js", ".jsx", ".mjs", ".cjs",
              ".ts", ".tsx", ".c", ".cc", ".cpp", ".cxx", ".h", ".hpp",
              ".cs", ".rs", ".kt", ".kts", ".rb", ".php"
          }
          exclude_dirs = {
              ".git", ".github", ".codemender", ".cm_project", ".cm_shard",
              "node_modules", "vendor", "dist", "bin", "target", "obj",
              "build", ".gradle", "test", "tests", "__tests__", "spec",
              "mocks", "fixtures", "docs", "examples", "migrations",
              "third_party", "results", "scorecard", "scripts"
          }
          exclude_suffixes = (".min.js", "-min.js", ".bundle.js", ".min.cjs", ".min.mjs")

          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in exclude_dirs and not d.startswith(".")]
              for f in files:
                  fl = f.lower()
                  if fl.endswith(exclude_suffixes):
                      continue
                  if pathlib.Path(fl).suffix in include_exts:
                      p = os.path.normpath(os.path.join(root, f))
                      try:
                          sz = os.path.getsize(p)
                      except OSError:
                          sz = 1000
                      all_files.append((p, max(1, sz)))

          all_files.sort(key=lambda x: (-x[1], x[0]))
          shards = [{"id": i, "weight": 0, "files": []} for i in range(num_shards)]
          for path, sz in all_files:
              target = min(shards, key=lambda s: (s["weight"], len(s["files"]), s["id"]))
              target["files"].append((path, sz))
              target["weight"] += sz

          my_files = shards[shard_id]["files"] if shard_id < len(shards) else []
          os.makedirs(".cm_shard", exist_ok=True)

          path_map = {}
          used_names = set()
          for rel_path, _ in my_files:
              flat_name = os.path.basename(rel_path)
              if flat_name in used_names:
                  flat_name = rel_path.replace(os.sep, "__")
              used_names.add(flat_name)

              os.link(rel_path, os.path.join(".cm_shard", flat_name))
              path_map[f".cm_shard/{flat_name}"] = rel_path
              path_map[flat_name] = rel_path

          with open(os.path.join(runner_temp, "path-map.json"), "w") as fp:
              json.dump(path_map, fp)

          print(f"Shard {shard_id}: staged {len(my_files)} files into .cm_shard")
          EOF

          file_count=$(find .cm_shard -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$file_count" -eq 0 ]; then
            echo "[]" > "$RUNNER_TEMP/findings-shard-${SHARD_ID}.json"
            exit 0
          fi

          printf '%s\n' .cm_shard .cm_project >> .git/info/exclude
          shard_abs_path="$(cd .cm_shard && pwd)"

          for attempt in 1 2 3; do
            export CM_HOME="$RUNNER_TEMP/cm_home"
            rm -rf "$CM_HOME" .cm_shard/.cm_project
            mkdir -p "$CM_HOME"

            cm init
            cat <<EOF > "$CM_HOME/config.yaml"
          model: "$CM_MODEL"
          human_confirmation: false
          confirm_writes: false
          project_paths:
            - "$shard_abs_path"
          sandbox:
            enabled: false
          EOF

            echo "=== [Shard $SHARD_ID] Scanning ${file_count} files (Attempt ${attempt}/3) ==="
            if cm find .cm_shard \
              --model="$CM_MODEL" \
              --sandbox=false \
              --yes \
              --bypass-warning \
              --compact \
              -c "All ${file_count} target files are directly in the current root directory (.). Step 1: Call list_dir on '.' once. Step 2+: Call read_file in parallel batches of up to 12 files per turn so all ${file_count} files are read in 1-2 turns (NEVER call read_file on more than 12 files in a single turn). STRICT RULES: (1) NEVER call read_file on the same file twice. (2) NEVER call grep_search or access any path outside '.'. (3) Immediately after reading all files once, output all vulnerabilities found and finish."; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "❌ [Shard $SHARD_ID] Failed after 3 attempts."
              exit 1
            fi
            echo "⚠️ [Shard $SHARD_ID] Attempt ${attempt} failed. Retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done

          cm report --format=json --status=OPEN \
            | jq --slurpfile pmap "$RUNNER_TEMP/path-map.json" '
                ($pmap[0] // {}) as $m
                | map(.file_path as $fp | .file_path = ($m[$fp] // ($fp | sub("^\\.cm_shard/"; ""))))
              ' \
            > "$RUNNER_TEMP/findings-shard-${SHARD_ID}.json"

      - name: Cancel Any Lingering Backend Sessions on Timeout/Failure
        if: ${{ failure() || cancelled() }}
        run: |
          for home_dir in "$RUNNER_TEMP"/cm_home_*; do
            [ -d "$home_dir" ] || continue
            export CM_HOME="$home_dir"
            # Cancel any active backend sessions so they don't hold quota slots
            cm session list 2>/dev/null | awk '/RUNNING|WAITING_FOR_TOOL/ {print $1}' | while read -r sid; do
              [ -n "$sid" ] && cm session cancel "$sid" || true
            done
            cm clean || true
          done

      - name: Upload Shard Findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: codemender-shard-${{ matrix.shard.id }}
          path: ${{ runner.temp }}/findings-shard-${{ matrix.shard.id }}.json
          retention-days: 1

  # ============================================================================
  # TIER 2 (STEP 3): Fan-In Aggregation, SARIF Upload & Policy Gate (< 1 minute)
  # ============================================================================
  aggregate-and-report:
    name: Aggregate Deep Scan Results
    needs: deep-scan-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.wif_provider }}
          service_account: ${{ secrets.wif_service_account }}

      - name: Install CodeMender CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cm.zip" "$CM_DOWNLOAD_URL"
          unzip -q -o "$RUNNER_TEMP/cm.zip" -d "$RUNNER_TEMP/cm"
          chmod +x "$RUNNER_TEMP/cm/cm"
          echo "$RUNNER_TEMP/cm" >> "$GITHUB_PATH"

      - name: Download All Shard Findings
        uses: actions/download-artifact@v4
        with:
          pattern: codemender-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - name: Merge Findings, Export SARIF, and Enforce Gate
        run: |
          cm init

          # Merge and deduplicate findings across all shards into `cm report import` schema
          jq -s '
            add // []
            | unique_by(.file_path, .line, .title)
            | map({
                file_path: .file_path,
                title: .title,
                message: (.message // .description // .title),
                severity: .severity,
                vuln_type: (.vuln_type // "CWE-Other"),
                vuln_id: (.vuln_id),
                confidence: (.confidence),
                analysis: (.analysis),
                snippet: (.snippet),
                start_line (.start_line),
                start_line (.end_line)
              })
          ' "$RUNNER_TEMP"/shards/findings-shard-*.json > "$RUNNER_TEMP/merged-findings.json"

          count=$(jq 'length' "$RUNNER_TEMP/merged-findings.json")
          echo "Total unique findings across all shards: $count"

          if [ "$count" -gt 0 ]; then
            cm report import --file "$RUNNER_TEMP/merged-findings.json"
          fi

          # Generate SARIF v2.1.0 for GitHub Code Scanning and Markdown for Job Summary
          # cm report -f sarif --status=OPEN > codemender.sarif
          cm report -f md --status=OPEN >> "$GITHUB_STEP_SUMMARY"

          # Fail workflow if any finding matches FAIL_ON_SEVERITIES (CRITICAL,HIGH)
          # blocking=$(jq --arg fail_on "$FAIL_ON_SEVERITIES" '
          #   ($fail_on | ascii_upcase | split(",")) as $sev
          #   | [.[] | select(.severity | ascii_upcase | IN($sev[]))] | length
          # ' "$RUNNER_TEMP/merged-findings.json")

          # if [ "$blocking" -gt 0 ]; then
          #   echo "::error::CodeMender found $blocking blocking ($FAIL_ON_SEVERITIES) vulnerabilities."
          #   exit 1
          # fi

