name: CodeMender Security Scan
    
on:
  pull_request:
    branches: [main]
  # schedule:
    # Nightly full-repo deep scan at 02:00 UTC
    # - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of parallel runners for Deep Scan'
        required: false
        default: '20'

permissions: {}

defaults:
  run:
    shell: bash

env:
  CM_DOWNLOAD_URL: https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media
  CM_MODEL: gemini-3.8-flash
  FAIL_ON_SEVERITIES: CRITICAL,HIGH

jobs:
  # ============================================================================
  # TIER 1: Pull Request Diff + Caller/Callee Impact Scan (< 2 minutes)
  # ============================================================================
  pr-diff-scan:
    name: CodeMender PR Diff Scan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install CodeMender CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cm.zip" "$CM_DOWNLOAD_URL"
          unzip -q -o "$RUNNER_TEMP/cm.zip" -d "$RUNNER_TEMP/cm"
          chmod +x "$RUNNER_TEMP/cm/cm"
          echo "$RUNNER_TEMP/cm" >> "$GITHUB_PATH"

      - name: Run Diff Scan with Impact Analysis
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cm init
          cm find . \
            --diff="origin/$BASE_REF" \
            --diff-workers=16 \
            --diff-depth=2 \
            --diff-max-neighbors=15 \
            --model="$CM_MODEL" \
            --fail-on="$FAIL_ON_SEVERITIES" \
            --sandbox=false
          cm report -f sarif > codemender-pr.sarif 

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ !cancelled() && hashFiles('codemender-pr.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codemender-pr.sarif
          category: codemender-pr

  # ============================================================================
  # TIER 2 (STEP 1): Dynamic LPT Directory Sharding (< 15 seconds)
  # ============================================================================
  prepare-shards:
    name: Compute Balanced Scan Shards
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.shard.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Partition files into balanced directory shards
        id: shard
        env:
          NUM_SHARDS: ${{ inputs.shards || '20' }}
        run: |
          python3 - << 'EOF'
          import json, os, pathlib

          num_shards = int(os.environ.get("NUM_SHARDS", "20"))
          max_files_per_unit = 200

          include_exts = {
              ".py", ".java", ".go", ".js", ".jsx", ".mjs", ".cjs",
              ".ts", ".tsx", ".c", ".cc", ".cpp", ".cxx", ".h", ".hpp",
              ".cs", ".rs", ".kt", ".kts", ".rb", ".php"
          }
          exclude_dirs = {
              ".git", ".github", ".codemender", ".cm_project",
              "node_modules", "vendor", "dist", "bin", "target", "obj",
              "build", ".gradle", "test", "tests", "__tests__", "spec",
              "mocks", "fixtures", "docs", "examples", "migrations", "third_party"
          }

          # Map each directory to its direct scannable files
          dir_direct_files = {}
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in exclude_dirs and not d.startswith(".")]
              count = sum(1 for f in files if pathlib.Path(f).suffix in include_exts)
              if count > 0:
                  rel = os.path.relpath(root, ".")
                  dir_direct_files[rel] = count

          # Subdivide directories so no single scan unit exceeds max_files_per_unit
          # unless the files are directly inside that single directory
          def collect_units(path):
              subdirs = [
                  d for d in dir_direct_files
                  if d != path and (path == "." or d.startswith(path + "/"))
              ]
              total = dir_direct_files.get(path, 0) + sum(dir_direct_files[d] for d in subdirs)
              if total == 0:
                  return []
              if total <= max_files_per_unit or not subdirs:
                  return [(path, total, False)]
              # Split into immediate children + direct files in current dir
              units = []
              if dir_direct_files.get(path, 0) > 0:
                  units.append((path, dir_direct_files[path], True))
              immediate_children = sorted({
                  d.split("/")[0] if path == "." else path + "/" + d[len(path)+1:].split("/")[0]
                  for d in subdirs
              })
              for child in immediate_children:
                  units.extend(collect_units(child))
              return units

          units = collect_units(".")
          units.sort(key=lambda x: x[1], reverse=True)

          # Greedy LPT bin-packing across N shards
          shards = [{"id": i, "weight": 0, "targets": []} for i in range(num_shards)]
          for path, weight, direct_only in units:
              lightest = min(shards, key=lambda s: s["weight"])
              lightest["targets"].append({"path": path, "direct_only": direct_only})
              lightest["weight"] += weight

          active_shards = [s for s in shards if s["targets"]]
          print(f"Created {len(active_shards)} shards. Weights: {[s['weight'] for s in active_shards]}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(active_shards)}\n")
          EOF

  # ============================================================================
  # TIER 2 (STEP 2): Parallel Sharded Deep Scan (20 runners x 16 workers = 320 workers)
  # ============================================================================
  deep-scan-shard:
    name: Deep Scan Shard ${{ matrix.shard.id }}
    needs: prepare-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.prepare-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Install CodeMender CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cm.zip" "$CM_DOWNLOAD_URL"
          unzip -q -o "$RUNNER_TEMP/cm.zip" -d "$RUNNER_TEMP/cm"
          chmod +x "$RUNNER_TEMP/cm/cm"
          echo "$RUNNER_TEMP/cm" >> "$GITHUB_PATH"

      - name: Configure CodeMender & Run Sharded Deep Scan
        env:
          SHARD_TARGETS: ${{ toJson(matrix.shard.targets) }}
          CM_TELEMETRY_OPT_OUT: "1"
        run: |
          cm init

          # Base config: grant read access to full repo for cross-file validation
          # while pruning non-production directories
          cat <<EOF > ~/.codemender/config.yaml
          model: "$CM_MODEL"
          human_confirmation: false
          confirm_writes: false
          project_paths:
            - "$GITHUB_WORKSPACE"
          sandbox:
            enabled: false
          scan:
            exclude_dirs:
              - node_modules
              - vendor
              - dist
              - bin
              - target
              - obj
              - build
              - .gradle
              - test
              - tests
              - __tests__
              - spec
              - mocks
              - fixtures
              - docs
              - examples
              - migrations
              - third_party
          EOF

          cp ~/.codemender/config.yaml "$RUNNER_TEMP/base-config.yaml"

          # Scan each directory assigned to this shard
          echo "$SHARD_TARGETS" | jq -c '.[]' | while read -r item; do
            target_path=$(echo "$item" | jq -r '.path')
            direct_only=$(echo "$item" | jq -r '.direct_only')

            cp "$RUNNER_TEMP/base-config.yaml" ~/.codemender/config.yaml
            if [ "$direct_only" = "true" ]; then
              # Exclude immediate subdirectories because another shard owns them
              find "$target_path" -mindepth 1 -maxdepth 1 -type d -printf "    - %f\n" >> ~/.codemender/config.yaml
            fi

            echo "=== Deep scanning $target_path (direct_only=$direct_only) ==="
            cm find "$target_path" \
              --deep \
              --deep-workers=16 \
              --model="$CM_MODEL" \
              --sandbox=false \
              --compact
          done

          # Export all OPEN findings accumulated in this runner's state.db
          cm report --format=json --status=OPEN > "$RUNNER_TEMP/findings-shard-${{ matrix.shard.id }}.json"

      - name: Upload Shard Findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: codemender-shard-${{ matrix.shard.id }}
          path: ${{ runner.temp }}/findings-shard-${{ matrix.shard.id }}.json
          retention-days: 1

  # ============================================================================
  # TIER 2 (STEP 3): Fan-In Aggregation, SARIF Upload & Policy Gate (< 1 minute)
  # ============================================================================
  aggregate-and-report:
    name: Aggregate Deep Scan Results
    needs: deep-scan-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Install CodeMender CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cm.zip" "$CM_DOWNLOAD_URL"
          unzip -q -o "$RUNNER_TEMP/cm.zip" -d "$RUNNER_TEMP/cm"
          chmod +x "$RUNNER_TEMP/cm/cm"
          echo "$RUNNER_TEMP/cm" >> "$GITHUB_PATH"

      - name: Download All Shard Findings
        uses: actions/download-artifact@v4
        with:
          pattern: codemender-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - name: Merge Findings, Export SARIF, and Enforce Gate
        run: |
          cm init

          # Merge and deduplicate findings across all shards into `cm report import` schema
          jq -s '
            add // []
            | unique_by(.file_path, .line, .title)
            | map({
                file_path: .file_path,
                line: (.line // 1),
                title: .title,
                message: (.message // .description // .title),
                severity: .severity,
                vuln_type: (.vuln_type // "CWE-Other")
              })
          ' "$RUNNER_TEMP"/shards/findings-shard-*.json > "$RUNNER_TEMP/merged-findings.json"

          count=$(jq 'length' "$RUNNER_TEMP/merged-findings.json")
          echo "Total unique findings across all shards: $count"

          if [ "$count" -gt 0 ]; then
            cm report import --file "$RUNNER_TEMP/merged-findings.json"
          fi

          # Generate SARIF v2.1.0 for GitHub Code Scanning and Markdown for Job Summary
          cm report --format=sarif --status=OPEN > codemender.sarif
          cm report --format=md --status=OPEN >> "$GITHUB_STEP_SUMMARY"

          # Fail workflow if any finding matches FAIL_ON_SEVERITIES (CRITICAL,HIGH)
          blocking=$(jq --arg fail_on "$FAIL_ON_SEVERITIES" '
            ($fail_on | ascii_upcase | split(",")) as $sev
            | [.[] | select(.severity | ascii_upcase | IN($sev[]))] | length
          ' "$RUNNER_TEMP/merged-findings.json")

          if [ "$blocking" -gt 0 ]; then
            echo "::error::CodeMender found $blocking blocking ($FAIL_ON_SEVERITIES) vulnerabilities."
            exit 1
          fi

      - name: Upload Consolidated SARIF to GitHub Code Scanning
        if: ${{ !cancelled() && hashFiles('codemender.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codemender.sarif
          category: codemender-deep
