name: CodeMender Security Scan
    
on:
  pull_request:
    branches: [main]
  # schedule:
    # Nightly full-repo deep scan at 02:00 UTC
    # - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of parallel runners for Deep Scan'
        required: false
        default: '120'
  workflow_call:
    inputs:
      shards:
        required: false
        type: string
        default: '10'
    secrets:
      wif_provider:
          required: true
      wif_service_account:
          required: true
          

permissions:
    contents: read
    id-token: write
    pull-requests: write
    security-events: write

defaults:
  run:
    shell: bash

env:
  CM_DOWNLOAD_URL: https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media
  CM_MODEL: gemini-3.8-flash
  FAIL_ON_SEVERITIES: CRITICAL,HIGH

jobs:
  # ============================================================================
  # TIER 1: Pull Request Diff + Caller/Callee Impact Scan (< 2 minutes)
  # ============================================================================
  pr-diff-scan:
    name: CodeMender PR Diff Scan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.wif_provider }}
          service_account: ${{ secrets.wif_service_account }}

      - name: Install CodeMender CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cm.zip" "$CM_DOWNLOAD_URL"
          unzip -q -o "$RUNNER_TEMP/cm.zip" -d "$RUNNER_TEMP/cm"
          chmod +x "$RUNNER_TEMP/cm/cm"
          echo "$RUNNER_TEMP/cm" >> "$GITHUB_PATH"

      - name: Run Diff Scan with Impact Analysis
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cm init
          cm find . \
            --diff="origin/$BASE_REF" \
            --diff-workers=16 \
            --diff-depth=2 \
            --diff-max-neighbors=15 \
            --model="$CM_MODEL" \
            --fail-on="$FAIL_ON_SEVERITIES" \
            --sandbox=false
          cm report -f sarif > codemender-pr.sarif 

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ !cancelled() && hashFiles('codemender-pr.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codemender-pr.sarif
          category: codemender-pr

  # ============================================================================
  # TIER 2 (STEP 1): Dynamic LPT Directory Sharding (< 15 seconds)
  # ============================================================================
  prepare-shards:
    name: Compute Balanced Scan Shards
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.shard.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Partition files evenly across shards
        id: shard
        env:
          NUM_SHARDS: ${{ inputs.shards || '20' }}
        run: |
          python3 - << 'EOF'
          import json, os, pathlib

          num_shards = int(os.environ.get("NUM_SHARDS", "20"))

          include_exts = {
              ".py", ".java", ".go", ".js", ".jsx", ".mjs", ".cjs",
              ".ts", ".tsx", ".c", ".cc", ".cpp", ".cxx", ".h", ".hpp",
              ".cs", ".rs", ".kt", ".kts", ".rb", ".php"
          }
          exclude_dirs = {
              ".git", ".github", ".codemender", ".cm_project", ".cm_shard",
              "node_modules", "vendor", "dist", "bin", "target", "obj",
              "build", ".gradle", "test", "tests", "__tests__", "spec",
              "mocks", "fixtures", "docs", "examples", "migrations", "third_party"
          }

          # Collect every scannable file and its byte size
          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in exclude_dirs and not d.startswith(".")]
              for f in files:
                  if pathlib.Path(f).suffix in include_exts:
                      rel_path = os.path.relpath(os.path.join(root, f), ".")
                      size = max(1, os.path.getsize(rel_path))
                      all_files.append((rel_path, size))

          # Sort largest files first (LPT) and distribute across N shards
          all_files.sort(key=lambda x: x[1], reverse=True)
          shards = [{"id": i, "file_count": 0, "byte_weight": 0} for i in range(num_shards)]

          for _, size in all_files:
              # Pick shard with fewest files (tie-break by byte_weight)
              target = min(shards, key=lambda s: (s["file_count"], s["byte_weight"]))
              target["file_count"] += 1
              target["byte_weight"] += size

          active_shards = [{"id": s["id"], "file_count": s["file_count"]} for s in shards if s["file_count"] > 0]
          print(f"Created {len(active_shards)} shards. File counts: {[s['file_count'] for s in active_shards]}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(active_shards)}\n")
          EOF

  # ============================================================================
  # TIER 2 (STEP 2): Parallel Sharded Deep Scan (20 runners x 16 workers = 320 workers)
  # ============================================================================
  deep-scan-shard:
    name: Scan Shard ${{ matrix.shard.id }} (${{ matrix.shard.file_count }} files)
    needs: prepare-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJson(needs.prepare-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.wif_provider }}
          service_account: ${{ secrets.wif_service_account }}

      - name: Install CodeMender CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cm.zip" "$CM_DOWNLOAD_URL"
          unzip -q -o "$RUNNER_TEMP/cm.zip" -d "$RUNNER_TEMP/cm"
          chmod +x "$RUNNER_TEMP/cm/cm"
          echo "$RUNNER_TEMP/cm" >> "$GITHUB_PATH"

      - name: Build 12 Batches & Run Concurrent Single-Session Scans
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          NUM_BATCHES: 12
        run: |
          set -euo pipefail

          # 1. Distribute shard files into 12 flat batch directories (~23 files each)
          #    and record a path-map.json to restore original relative paths in reports.
          python3 - <<'PYEOF'
          import json, os, shutil

          num_batches = int(os.environ.get("NUM_BATCHES", "12"))
          with open("shard-files.txt") as f:
              files = [line.strip() for line in f if line.strip()]

          batches = [[] for _ in range(num_batches)]
          for idx, filepath in enumerate(files):
              batches[idx % num_batches].append(filepath)

          path_map = {}
          counts = []
          for b_idx, batch_files in enumerate(batches):
              if not batch_files:
                  continue
              batch_name = f"batch_{b_idx:02d}"
              batch_dir = os.path.join(".cm_shard", batch_name)
              os.makedirs(batch_dir, exist_ok=True)
              counts.append(len(batch_files))

              for src_path in batch_files:
                  base = os.path.basename(src_path)
                  dst_name = base
                  # Guard against duplicate basenames within the same batch
                  collision = 1
                  while os.path.exists(os.path.join(batch_dir, dst_name)):
                      stem, ext = os.path.splitext(base)
                      dst_name = f"{stem}_{collision}{ext}"
                      collision += 1

                  dst_rel = f".cm_shard/{batch_name}/{dst_name}"
                  try:
                      os.link(src_path, dst_rel)
                  except OSError:
                      shutil.copy2(src_path, dst_rel)

                  path_map[dst_rel] = src_path
                  path_map[f"{batch_name}/{dst_name}"] = src_path

          with open(".cm_shard/path-map.json", "w") as out:
              json.dump(path_map, out, indent=2)

          print(f"Shard {os.environ.get('SHARD_INDEX')}: distributed {len(files)} files into {len(counts)} flat batches: {counts}")
          PYEOF

          mkdir -p reports

          scan_batch() {
            local batch_dir="$1"
            local stagger_sec="$2"
            local batch_name
            batch_name=$(basename "$batch_dir")
            local batch_abs_path
            batch_abs_path=$(cd "$batch_dir" && pwd)
            local file_count
            file_count=$(find "$batch_dir" -maxdepth 1 -type f | wc -l)

            # Stagger startup to avoid simultaneous 120-session API bursts
            if [ "$stagger_sec" -gt 0 ]; then
              sleep "$stagger_sec"
            fi

            local max_attempts=3
            local attempt=1
            local scan_ok=0

            while [ "$attempt" -le "$max_attempts" ]; do
              export CM_HOME="${RUNNER_TEMP:-/tmp}/cm_home_${batch_name}"
              rm -rf "$CM_HOME" "$batch_dir/.cm_project"
              mkdir -p "$CM_HOME"

              echo "=== [Shard ${SHARD_INDEX} / ${batch_name}] Scanning ${file_count} files (Attempt ${attempt}/${max_attempts}) ==="

              cm init

              # Restrict project_paths strictly to this batch's directory
              python3 - "$CM_HOME/config.yaml" "$batch_abs_path" <<'PYEOF'
          import sys, re
          cfg_path, batch_abs = sys.argv[1], sys.argv[2]
          with open(cfg_path, "r") as f:
              content = f.read()
          content = re.sub(
              r"project_paths:\s*\n(?:\s*-\s*.*\n?)+",
              f'project_paths:\n  - "{batch_abs}"\n',
              content,
          )
          with open(cfg_path, "w") as f:
              f.write(content)
          PYEOF

              if cm find "$batch_dir" \
                -c "All ${file_count} target files are directly in the current root directory (.). Step 1: Call list_dir on '.' once. Step 2+: Call read_file in parallel batches of 12-15 files per turn so all ${file_count} files are read in 2 turns. STRICT RULES: (1) NEVER call read_file on the same file twice. (2) NEVER call grep_search or access any path outside '.'. (3) Immediately after reading all files once, output all vulnerabilities found and finish."; then
                scan_ok=1
                break
              else
                echo "⚠️ [Shard ${SHARD_INDEX} / ${batch_name}] Attempt ${attempt} failed (likely transient Vertex AI code=13). Retrying in $((attempt * 5))s..."
                sleep $((attempt * 5))
                attempt=$((attempt + 1))
              fi
            done

            if [ "$scan_ok" -ne 1 ]; then
              echo "❌ [Shard ${SHARD_INDEX} / ${batch_name}] Failed after ${max_attempts} attempts."
              rm -rf "$CM_HOME"
              return 1
            fi

            cm report -o "reports/report-shard-${SHARD_INDEX}-${batch_name}.md" || true

            # Restore original repository file paths in the generated report
            if [ -f "reports/report-shard-${SHARD_INDEX}-${batch_name}.md" ]; then
              python3 - "reports/report-shard-${SHARD_INDEX}-${batch_name}.md" ".cm_shard/path-map.json" <<'PYEOF'
          import json, sys
          report_path, map_path = sys.argv[1], sys.argv[2]
          with open(map_path) as f:
              path_map = json.load(f)
          with open(report_path) as f:
              text = f.read()
          for flat_path, orig_path in sorted(path_map.items(), key=lambda x: -len(x[0])):
              text = text.replace(flat_path, orig_path)
          with open(report_path, "w") as f:
              f.write(text)
          PYEOF
            fi

            rm -rf "$CM_HOME"
          }

          pids=()
          idx=0
          for batch_dir in .cm_shard/batch_*; do
            [ -d "$batch_dir" ] || continue
            stagger=$((idx * 2))
            scan_batch "$batch_dir" "$stagger" &
            pids+=($!)
            idx=$((idx + 1))
          done

          fail=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              fail=1
            fi
          done

          rm -rf .cm_shard
          exit "$fail"

      - name: Cancel Any Lingering Backend Sessions on Timeout/Failure
        if: ${{ failure() || cancelled() }}
        run: |
          for home_dir in "$RUNNER_TEMP"/cm_home_*; do
            [ -d "$home_dir" ] || continue
            export CM_HOME="$home_dir"
            # Cancel any active backend sessions so they don't hold quota slots
            cm session list 2>/dev/null | awk '/RUNNING|WAITING_FOR_TOOL/ {print $1}' | while read -r sid; do
              [ -n "$sid" ] && cm session cancel "$sid" || true
            done
            cm clean || true
          done

      - name: Upload Shard Findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: codemender-shard-${{ matrix.shard.id }}
          path: ${{ runner.temp }}/findings-shard-${{ matrix.shard.id }}.json
          retention-days: 1

  # ============================================================================
  # TIER 2 (STEP 3): Fan-In Aggregation, SARIF Upload & Policy Gate (< 1 minute)
  # ============================================================================
  aggregate-and-report:
    name: Aggregate Deep Scan Results
    needs: deep-scan-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.wif_provider }}
          service_account: ${{ secrets.wif_service_account }}

      - name: Install CodeMender CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cm.zip" "$CM_DOWNLOAD_URL"
          unzip -q -o "$RUNNER_TEMP/cm.zip" -d "$RUNNER_TEMP/cm"
          chmod +x "$RUNNER_TEMP/cm/cm"
          echo "$RUNNER_TEMP/cm" >> "$GITHUB_PATH"

      - name: Download All Shard Findings
        uses: actions/download-artifact@v4
        with:
          pattern: codemender-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - name: Merge Findings, Export SARIF, and Enforce Gate
        run: |
          cm init

          # Merge and deduplicate findings across all shards into `cm report import` schema
          jq -s '
            add // []
            | unique_by(.file_path, .line, .title)
            | map({
                file_path: .file_path,
                line: (.line // 1),
                title: .title,
                message: (.message // .description // .title),
                severity: .severity,
                vuln_type: (.vuln_type // "CWE-Other")
              })
          ' "$RUNNER_TEMP"/shards/findings-shard-*.json > "$RUNNER_TEMP/merged-findings.json"

          count=$(jq 'length' "$RUNNER_TEMP/merged-findings.json")
          echo "Total unique findings across all shards: $count"

          if [ "$count" -gt 0 ]; then
            cm report import --file "$RUNNER_TEMP/merged-findings.json"
          fi

          # Generate SARIF v2.1.0 for GitHub Code Scanning and Markdown for Job Summary
          cm report --format=sarif --status=OPEN > codemender.sarif
          cm report --format=md --status=OPEN >> "$GITHUB_STEP_SUMMARY"

          # Fail workflow if any finding matches FAIL_ON_SEVERITIES (CRITICAL,HIGH)
          blocking=$(jq --arg fail_on "$FAIL_ON_SEVERITIES" '
            ($fail_on | ascii_upcase | split(",")) as $sev
            | [.[] | select(.severity | ascii_upcase | IN($sev[]))] | length
          ' "$RUNNER_TEMP/merged-findings.json")

          if [ "$blocking" -gt 0 ]; then
            echo "::error::CodeMender found $blocking blocking ($FAIL_ON_SEVERITIES) vulnerabilities."
            exit 1
          fi

      - name: Upload Consolidated SARIF to GitHub Code Scanning
        if: ${{ !cancelled() && hashFiles('codemender.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codemender.sarif
          category: codemender-deep
