name: Test SARIF Upload Orchestrator
on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      security-events: write 
      contents: read
      
    steps:
      # 1. Check out the target repository into a subfolder
      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          repository: 'CodeMender-Demo/cm-python-sample'
          path: 'cm-python-sample'
          token: ${{ secrets.GH_TOKEN }}

      # 2. Generate a valid minimal dummy SARIF payload file
      - name: Generate Mock SARIF File
        run: |
          cat << 'EOF' > ${{ github.workspace }}/cm-python-sample/results.sarif
          {
            "$schema": "https://schemastore.org",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "CodeMender-Test",
                    "version": "1.0.0",
                    "rules": [
                      {
                        "id": "CM001",
                        "shortDescription": {
                          "text": "Mock testing rule definition."
                        }
                      }
                    ]
                  }
                },
                "results": [
                  {
                    "ruleId": "CM001",
                    "message": {
                      "text": "This is a successful mock diagnostic validation result."
                    },
                    "locations": [
                      {
                        "physicalLocation": {
                          "artifactLocation": {
                            "uri": "README.md"
                          },
                          "region": {
                            "startLine": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
          echo "Mock SARIF file written successfully."

      # # 3. Extract the Git metadata cleanly with verified fallbacks
      # - name: Extract Target Git Metadata
      #   id: extract_meta
      #   run: |
      #     cd "${{ github.workspace }}/cm-python-sample"
          
      #     # DETECTED_SHA=$(git rev-parse HEAD 2>/dev/null || echo "${{ github.sha }}")
      #     # DETECTED_REF=$(git symbolic-ref HEAD 2>/dev/null || echo "refs/heads/main")
          
      #     # # Inject directly to GITHUB_ENV for runtime access
      #     # echo "TARGET_COMMIT_SHA=$DETECTED_SHA" >> $GITHUB_ENV
      #     # echo "TARGET_BRANCH_REF=$DETECTED_REF" >> $GITHUB_ENV
          
      #     # echo "Extracted SHA: $DETECTED_SHA"
      #     # echo "Extracted Ref: $DETECTED_REF"

      #     echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      #     echo "ref=$(git symbolic-ref HEAD)" >> $GITHUB_OUTPUT

      # # 4. Upload the SARIF payload using the RUNTIME env variables mapping
      # - name: Upload SARIF payload via official Engine
      #   uses: github/codeql-action/upload-sarif@v4
      #   # env:
      #   #   # This forces GitHub Actions to read the values dynamically during runtime execution
      #   #   INPUT_COMMIT_SHA: ${{ env.TARGET_COMMIT_SHA }}
      #   #   INPUT_REF: ${{ env.TARGET_BRANCH_REF }}
      #   with:
      #     sarif_file: 'mock-output.sarif'
      #     checkout_path: '${{ github.workspace }}/cm-python-sample'
      #     repository: 'CodeMender-Demo/cm-python-sample'
      #     token: ${{ secrets.GH_TOKEN }}
      #     tool_name: 'CodeMender'
      #     ref: ${{ steps.extract_meta.outputs.ref }}
      #     sha: ${{ steps.extract_meta.outputs.sha }}
      # 2. Extract Repo B's Git commit metadata needed for the API payload
      - name: Extract Repo B Metadata
        id: repo_b_meta
        run: |
          cd "${{ github.workspace }}/cm-python-sample"
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "ref=$(git symbolic-ref HEAD)" >> $GITHUB_OUTPUT

      # 3. RUN YOUR SCANNING TOOL HERE
      # Ensure your tool outputs its file to: target-repo-b/results.sarif

      - name: Upload SARIF to Repo B via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Encode the file
          cat ${{ github.workspace }}/cm-python-sample/results.sarif
          SARIF_GZ_B64=$(gzip -c ${{ github.workspace }}/cm-python-sample/results.sarif | base64 -w 0)
          
          # Send the API command directly using the gh helper tool
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/CodeMender-Demo/cm-python-sample/code-scanning/sarifs \
            -f sarif="$SARIF_GZ_B64" \
            -f ref="${{ steps.repo_b_meta.outputs.ref }}" \
            -f commit_sha="${{ steps.repo_b_meta.outputs.sha }}" \
            -f tool_name="CodeMender"
